services:
  web:
    image: &app-image "${COMPOSE_PROJECT_NAME:-railsstarter}-app:local"
    build:
      context: ./
      dockerfile: Dockerfile.local
    command: >
      bash -c "rm -f tmp/pids/server.pid && ./bin/thrust ./bin/rails server -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/rails
      # - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - HISTFILE=/usr/src/app/log/.bash_history
    depends_on:
      db-prepare:
        condition: service_completed_successfully
      # redis:
      #   condition: service_started
  worker:
    image: *app-image
    pull_policy: never
    command: ["./bin/worker-docker-entrypoint", "./bin/jobs"]
    volumes:
      - .:/rails
      # - bundle:/usr/local/bundle
    # ports:
    #   - "3000:3000"
    env_file:
      - .env
    environment:
      - HISTFILE=/usr/src/app/log/.bash_history
    depends_on:
      db-prepare:
        condition: service_completed_successfully
      # redis:
      #   condition: service_started
  db-prepare:
    image: *app-image
    pull_policy: never
    command: ["./bin/rails", "db:prepare"]
    restart: "no"
    volumes:
      - .:/rails
    env_file:
      - .env
    environment:
      - HISTFILE=/usr/src/app/log/.bash_history
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: '/usr/bin/mysql --protocol=TCP --host=127.0.0.1 --user=root --execute "SHOW DATABASES;"'
      interval: 2s
      timeout: 20s
      retries: 10
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
  # redis:
  #   image: redis
  #   volumes:
  #     - redis_data:/data
volumes:
  mysql_data:
  # redis_data:
  bundle:
