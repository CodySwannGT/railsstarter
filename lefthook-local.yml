pre-push:
  commands:
    rspec:
      env:
        PRIMARY_DB_HOST: 127.0.0.1
    reek:
      run: bundle exec reek app/ lib/
    flog:
      run: bundle exec flog --all --group app/ lib/
    flay:
      run: bundle exec flay app/ lib/
    yard-stats:
      run: >-
        bash -o pipefail -c 'bundle exec yard stats --no-save --no-cache --fail-on-warning "app/**/*.rb" "lib/**/*.rb" | grep -q "100.00% documented"'
