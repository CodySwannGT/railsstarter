<% require Rails.root.join("lib/upload_storage") %>
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Credentials come from the runtime SDK chain (ECS task role), never this file.
staging_uploads:
  service: S3
  bucket: <%= UploadStorage.configuration("staging").fetch(:bucket).to_json %>
  region: <%= UploadStorage.configuration("staging").fetch(:region).to_json %>

production_uploads:
  service: S3
  bucket: <%= UploadStorage.configuration("production").fetch(:bucket).to_json %>
  region: <%= UploadStorage.configuration("production").fetch(:region).to_json %>

upload_build_only:
  service: UploadBuildOnly

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# Use bin/rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name-<%= Rails.env %>

