# Seeded by Lisa on first setup — this caller belongs to the starter.
# Lisa's create-only delivery preserves its application-specific database inputs.

name: CI

on:
  pull_request:
  workflow_dispatch:

# The reusable quality-rails.yml declares checks:write and pull-requests:write.
# A caller must grant at least those, otherwise GitHub fails the run at startup
# ("requesting X, only allowed none") whenever the repo default token is
# read-only. Mirror the reusable's permissions here so CI can start.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality:
    name: Quality Checks
    # A reusable workflow may only DOWNGRADE the caller's grant, so the
    # work-item traceability job can enforce nothing the caller does not
    # hold. With no block here the job received contents+metadata read
    # only, and its `gh pr view` / `gh issue view` calls failed (#2476).
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: write
    uses: CodySwannGT/lisa/.github/workflows/quality-rails.yml@1db4b5f0e5e55ddc3ed5229e15ed337f1236081c # v4.73.9
    # railsstarter runs on MySQL (config/database.yml uses the mysql2 adapter).
    # Without this the reusable defaults to PostgreSQL and `bin/rails db:prepare`
    # fails. database_name matches the app's DATABASE_NAME default.
    with:
      expected_workflow_contract_major: '1'
      database_type: mysql
      database_version: '8.4.11'
      database_name: railsdb
    secrets:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  npm-context-read-baseline:
    name: NPM context read baseline
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
      attestations: read
    steps: &npm-context-read-steps
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
      - name: Prepare the original hash-pinned Linux GH executable
        run: |
          set -eu
          directory=$(mktemp -d "$RUNNER_TEMP/lisa-context-gh.XXXXXX")
          curl --fail --location --silent --show-error --max-time 60 --max-filesize 150000000 https://github.com/cli/cli/releases/download/v2.96.0/gh_2.96.0_linux_amd64.tar.gz --output "$directory/archive.tar.gz"
          tar -xzOf "$directory/archive.tar.gz" gh_2.96.0_linux_amd64/bin/gh > "$directory/gh"
          node scripts/diagnose-npm-context.mjs --check-gh "$directory/gh"
          sudo install -m 755 -- "$directory/gh" /usr/local/bin/gh
      - name: Run unchanged canonical read requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/diagnose-npm-context.mjs

  npm-context-read-pr:
    name: NPM context read with PR scope
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
      attestations: read
      pull-requests: read
    steps: *npm-context-read-steps
