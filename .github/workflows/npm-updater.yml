# Host-owned, temporary acceptance caller for issue #82.
# Remove this caller and its owned fixture after the genuine Bot check proof.
name: npm updater acceptance

on:
  workflow_dispatch:
    inputs:
      cancel_issue:
        description: Exact stale prepublication proposal issue for signed cancellation
        required: false
        type: string
        default: ''
      cancel_proposal_key:
        description: Exact original proposal key, required with a cancellation issue
        required: false
        type: string
        default: ''
      cancel_expected_main:
        description: Exact current main SHA, required with a cancellation issue
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  attestations: write
  id-token: write

jobs:
  selected_update:
    uses: CodySwannGT/lisa/.github/workflows/npm-updater.yml@49bcce1aacaea1aba5ff900d13d3c6231fa54ca7 # v4.74.2
    with:
      expected_workflow_contract_major: '1'
      npm-version: '10.9.9'
      runtime-profile: rails-mysql
      cancel_issue: ${{ inputs.cancel_issue }}
      cancel_proposal_key: ${{ inputs.cancel_proposal_key }}
      cancel_expected_main: ${{ inputs.cancel_expected_main }}
