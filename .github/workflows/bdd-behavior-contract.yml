# Host-owned caller for the behavior contract, using the locked released Lisa prover.
name: BDD Behavior Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavior-contract:
    name: Behavior Checks / 🧾 BDD Behavior Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Install locked released Lisa
        run: npm ci
      - name: Check the behavior contract and generated reports
        env:
          BDD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BDD_BASE_SHA" ]; then
            BDD_BASE_SHA=$(git merge-base HEAD origin/main)
            export BDD_BASE_SHA
          fi
          npm run bdd:coverage:write
          npm run bdd:matrix
          git diff --exit-code -- bdd/coverage-report.json docs/e2e-bdd-coverage.md docs/bdd-scenario-matrix.md
